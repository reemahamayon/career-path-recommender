{% extends "base.html" %}
{% block title %}Reset password · CareerPath AI{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">

<section class="auth-wrap">
  <div class="auth-card card">
    <div class="auth-head">
      <div class="auth-icon">🔒</div>
      <h1>Choose a new password</h1>
      <p class="muted">Use at least 8 characters. This link works once and expires in 1 hour.</p>
    </div>
    <form method="post" novalidate>
      <div class="field">
        <label for="password">New password</label>
        <input id="password" name="password" type="password" placeholder="At least 8 characters" required autofocus>
      </div>
      <div class="field">
        <label for="confirm">Confirm new password</label>
        <input id="confirm" name="confirm" type="password" placeholder="Repeat your new password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Update password</button>
    </form>
    <a href="{{ url_for('login') }}" class="back-link">← Back to log in</a>
  </div>
</section>
{% endblock %}
