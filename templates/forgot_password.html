{% extends "base.html" %}
{% block title %}Forgot password · CareerPath AI{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">

<section class="auth-wrap">
  <div class="auth-card card">
    <div class="auth-head">
      <div class="auth-icon">🔑</div>
      <h1>Forgot your password?</h1>
      <p class="muted">No worries. Enter your email and we'll send you a link to reset it.</p>
    </div>
    <form method="post" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" value="{{ email or '' }}" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
    </form>
    <a href="{{ url_for('login') }}" class="back-link">← Back to log in</a>
  </div>
</section>
{% endblock %}
